<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="color-scheme" content="light"/>
<link rel="icon" href="data:,"/>
<title>نموذج UI/UX — التطبيقات الثلاثة | سوق سموحة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Marhey:wght@500;600;700&family=Aref+Ruqaa:wght@400;700&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#16A34A; --green-d:#14532D; --green-soft:#DCFCE7; --green-bg:#F0FDF4;
  --amber:#F59E0B; --amber-soft:#FEF3C7; --red:#DC2626; --red-soft:#FEE2E2;
  --bg:#F7F8F7; --card:#fff; --ink:#14201A; --muted:#5B6B60; --line:#E3EAE4;
  --dark:#12291B; --radius:16px;
  --shadow:0 10px 30px rgba(20,83,45,.10);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
button{font-family:inherit;cursor:pointer;min-height:44px}
a{color:var(--green-d)}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
/* ===== Top intro ===== */
.intro{padding:28px 0 8px}
.intro h1{font-size:clamp(26px,4vw,40px);font-weight:900;margin:0 0 8px;line-height:1.25}
.intro h1 span{color:var(--green)}
.intro p{color:var(--muted);max-width:820px;margin:0;font-size:17px}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.badge{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;color:var(--green-d)}
.badge.amber{color:#92400E;background:var(--amber-soft);border-color:#FDE68A}
/* ===== App switcher ===== */
.switcher{position:sticky;top:0;z-index:50;background:rgba(247,248,247,.92);backdrop-filter:blur(10px);padding:12px 0;border-bottom:1px solid var(--line)}
.switcher-in{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.app-tab{flex:1;min-width:150px;border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 14px;text-align:right;display:flex;gap:12px;align-items:center;transition:.2s}
.app-tab .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex-shrink:0;background:var(--green-bg)}
.app-tab b{display:block;font-size:16px}
.app-tab small{color:var(--muted);font-weight:500}
.app-tab.active{border-color:var(--green);background:var(--green-bg);box-shadow:var(--shadow)}
.app-tab.active .ic{background:var(--green);color:#fff}
/* ===== Stage layout ===== */
.stage{display:grid;grid-template-columns:210px 1fr;gap:20px;padding:22px 0 10px;align-items:start}
@media(max-width:1020px){.stage{grid-template-columns:1fr}.screens-list{order:2}.notes{order:3}}
.screens-list h3,.notes h3{font-size:14px;color:var(--muted);margin:0 0 10px;font-weight:800}
.scr-btn{width:100%;text-align:right;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.scr-btn small{color:var(--muted);font-weight:500}
.scr-btn.active{border-color:var(--green);background:var(--green-bg);color:var(--green-d)}
.scr-btn .n{background:var(--green-soft);color:var(--green-d);border-radius:8px;width:26px;height:26px;display:grid;place-items:center;font-size:13px;flex-shrink:0}
.scr-btn.active .n{background:var(--green);color:#fff}
/* device */
.device-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.phone{width:380px;max-width:94vw;background:#0B0F0C;border-radius:44px;padding:11px;box-shadow:0 24px 60px rgba(20,32,26,.28)}
.phone-scr{background:#F7F8F7;border-radius:34px;overflow:hidden;height:720px;display:flex;flex-direction:column;position:relative}
.phone-scr.merchant{background:#EEF3EF}
.desktop{width:100%;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;min-height:640px;display:flex;flex-direction:column}
.statusbar{display:flex;justify-content:space-between;padding:10px 20px 4px;font-size:12px;font-weight:700;color:var(--ink);background:inherit}
.statusbar .dots{letter-spacing:2px}
.scr-body{flex:1;overflow-y:auto;padding:6px 16px 16px;scrollbar-width:thin}
.scr-body::-webkit-scrollbar{width:4px}.scr-body::-webkit-scrollbar-thumb{background:#CBD5CE;border-radius:4px}
.flow-hint{font-size:13px;color:var(--muted);text-align:center;max-width:420px}
.flow-hint b{color:var(--green-d)}
/* notes */
.notes{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;position:sticky;top:86px}
.notes h2{font-size:19px;margin:0 0 4px;font-weight:900}
.notes .who{font-size:13px;color:var(--green);font-weight:800;margin-bottom:10px}
.notes ul{margin:0;padding:0 18px 0 0}
.notes li{margin-bottom:8px;font-size:14.5px}
.notes .rule{background:var(--amber-soft);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:12px;color:#78350F}
.notes .rule b{display:block}
/* ===== inside-phone components ===== */
.p-head{display:flex;justify-content:space-between;align-items:center;margin:6px 0 10px}
.p-head .loc{font-size:13px;color:var(--muted)}
.p-head .loc b{color:var(--ink);font-size:15px;display:block}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:900}
.search{display:flex;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:4px 12px;align-items:center}
.search input{border:0;outline:0;flex:1;font-family:inherit;font-size:15px;background:transparent;min-height:40px}
.freebar{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin:12px 0}
.freebar .t{font-size:13.5px;font-weight:700;display:flex;justify-content:space-between}
.freebar .track{height:9px;background:#E7EDE8;border-radius:99px;margin-top:8px;overflow:hidden}
.freebar .fill{height:100%;background:linear-gradient(90deg,var(--green),#22C55E);border-radius:99px;transition:width .4s}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px;min-height:40px}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:6px 0 4px}
.cat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 4px;text-align:center;font-size:13px;font-weight:700;cursor:pointer}
.cat .ci{font-size:26px;display:block;margin-bottom:4px}
.sec-t{display:flex;justify-content:space-between;align-items:center;margin:16px 0 10px}
.sec-t h4{margin:0;font-size:17px;font-weight:900}
.sec-t a{font-size:13px;font-weight:700;text-decoration:none}
.offer{background:linear-gradient(120deg,var(--green-d),var(--green));color:#fff;border-radius:16px;padding:16px;position:relative;overflow:hidden}
.offer b{font-size:19px;display:block}
.offer span{font-size:13.5px;opacity:.92}
.offer .tag{position:absolute;left:14px;top:14px;background:var(--amber);color:#451A03;font-weight:900;border-radius:8px;padding:3px 10px;font-size:13px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;position:relative}
.pcard .img{height:86px;border-radius:12px;display:grid;place-items:center;font-size:42px;margin-bottom:8px}
.pcard h5{margin:0;font-size:14.5px;font-weight:800;line-height:1.4;min-height:40px}
.pcard .unit{font-size:12.5px;color:var(--muted)}
.pcard .row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.price{font-weight:900;font-size:16px;color:var(--green-d)}
.price small{font-size:12px;color:var(--muted);font-weight:500}
.old{font-size:12px;color:var(--muted);text-decoration:line-through;font-weight:500}
.qty{display:flex;align-items:center;gap:2px;background:var(--green-bg);border-radius:99px;padding:2px}
.qty button{width:34px;height:34px;min-height:34px;border:0;border-radius:50%;background:var(--green);color:#fff;font-size:18px;font-weight:900;display:grid;place-items:center;padding:0}
.qty button.minus{background:#fff;color:var(--green-d);border:1.5px solid var(--green)}
.qty b{min-width:24px;text-align:center}
.addbtn{border:0;background:var(--green);color:#fff;border-radius:99px;padding:0 18px;font-weight:800;font-size:14px;height:38px;min-height:38px}
.off-badge{position:absolute;top:8px;inset-inline-start:8px;background:var(--amber);color:#451A03;font-size:11.5px;font-weight:900;border-radius:7px;padding:2px 8px;z-index:2}
.bottomnav{display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.bottomnav button{flex:1;border:0;background:none;font-size:11.5px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px;min-height:48px;padding:4px 0;position:relative}
.bottomnav button .bi{font-size:21px}
.bottomnav button.on{color:var(--green)}
.cart-count{position:absolute;top:0;inset-inline-start:calc(50% - 2px);background:var(--red);color:#fff;font-size:11px;border-radius:99px;min-width:19px;height:19px;display:grid;place-items:center;padding:0 5px}
.cta-bar{padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
.btn-main{width:100%;border:0;background:var(--green);color:#fff;border-radius:14px;font-size:16.5px;font-weight:900;padding:14px;display:flex;justify-content:space-between;align-items:center}
.btn-main:disabled{background:#A7B8AC}
.btn-ghost{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:14px;font-weight:800;padding:12px;font-size:15px}
.btn-danger{width:100%;border:0;background:var(--red);color:#fff;border-radius:14px;font-weight:900;padding:13px;font-size:15.5px}
.btn-row{display:flex;gap:10px}.btn-row>*{flex:1}
.line-item{display:flex;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;align-items:center}
.line-item .img{width:56px;height:56px;border-radius:12px;display:grid;place-items:center;font-size:28px;flex-shrink:0}
.line-item h5{margin:0;font-size:14.5px}
.line-item .u{font-size:12.5px;color:var(--muted)}
.sum{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:6px}
.sum .r{display:flex;justify-content:space-between;font-size:14.5px;padding:4px 0}
.sum .r.total{border-top:1.5px dashed var(--line);margin-top:8px;padding-top:10px;font-weight:900;font-size:17px;color:var(--green-d)}
.sum .free{color:var(--green);font-weight:800}
.radio-card{display:flex;gap:12px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px;cursor:pointer;align-items:flex-start;width:100%;text-align:right}
.radio-card.on{border-color:var(--green);background:var(--green-bg)}
.radio-card .rd{width:22px;height:22px;border-radius:50%;border:2px solid #B9C6BC;flex-shrink:0;margin-top:2px;display:grid;place-items:center}
.radio-card.on .rd{border-color:var(--green)}
.radio-card.on .rd::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--green)}
.radio-card b{font-size:15px;display:block}
.radio-card span{font-size:13px;color:var(--muted)}
.timeline{margin:8px 0}
.tl{display:flex;gap:12px;position:relative;padding-bottom:22px}
.tl::before{content:"";position:absolute;inset-inline-start:13px;top:28px;bottom:0;width:2.5px;background:#DCE5DD}
.tl:last-child::before{display:none}
.tl .dot{width:28px;height:28px;border-radius:50%;background:#DCE5DD;color:#fff;display:grid;place-items:center;flex-shrink:0;z-index:1;font-size:14px}
.tl.done .dot{background:var(--green)}
.tl.now .dot{background:var(--amber);color:#451A03;box-shadow:0 0 0 5px var(--amber-soft)}
.tl b{font-size:15px}.tl span{display:block;font-size:13px;color:var(--muted)}
.mapbox{height:170px;border-radius:16px;background:#E4EFE2;position:relative;overflow:hidden;border:1px solid var(--line)}
.mapbox svg{position:absolute;inset:0;width:100%;height:100%}
.map-pin{position:absolute;background:var(--green);color:#fff;border-radius:12px;padding:5px 10px;font-size:12px;font-weight:800;box-shadow:var(--shadow)}
.status-pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 12px;font-size:12.5px;font-weight:800}
.st-new{background:#DBEAFE;color:#1E40AF}.st-prep{background:var(--amber-soft);color:#92400E}.st-way{background:#E0E7FF;color:#3730A3}.st-done{background:var(--green-soft);color:var(--green-d)}.st-late{background:var(--red-soft);color:var(--red)}
.st-pickup{background:#CCFBF1;color:#115E59}
/* merchant */
.m-head{background:var(--dark);color:#fff;border-radius:0 0 22px 22px;padding:14px 16px 16px;margin:-6px -16px 14px}
.m-head .row{display:flex;justify-content:space-between;align-items:center}
.m-head b{font-size:17px}
.m-head small{opacity:.75}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}
.kpi b{font-size:23px;font-weight:900;color:var(--green-d);display:block;line-height:1.2}
.kpi span{font-size:13px;color:var(--muted)}
.kpi.warn b{color:#B45309}.kpi.bad b{color:var(--red)}
.order-card{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.order-card.urgent{border-color:var(--red)}
.order-card .top{display:flex;justify-content:space-between;align-items:center}
.order-card .items{font-size:13.5px;color:var(--muted);margin:6px 0}
.timer{font-weight:900;border-radius:9px;padding:3px 10px;font-size:13.5px;background:var(--green-soft);color:var(--green-d)}
.timer.mid{background:var(--amber-soft);color:#92400E}.timer.late{background:var(--red-soft);color:var(--red)}
.check{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;width:100%;text-align:right;font-size:14.5px;font-weight:600}
.check .box{width:26px;height:26px;border-radius:8px;border:2px solid #B9C6BC;display:grid;place-items:center;color:#fff;flex-shrink:0;font-size:15px}
.check.done .box{background:var(--green);border-color:var(--green)}
.check.done .nm{color:var(--muted);text-decoration:line-through}
.check .q{margin-inline-start:auto;font-weight:900;color:var(--green-d)}
.inv-row{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.inv-row .img{width:48px;height:48px;border-radius:11px;display:grid;place-items:center;font-size:24px;flex-shrink:0}
.inv-row h5{margin:0;font-size:14.5px}.inv-row span{font-size:12.5px;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;min-height:36px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:17px;font-weight:900;padding:0}
.stepper b{min-width:30px;text-align:center;font-size:16px}
input[type=range]{width:100%;accent-color:var(--green);min-height:32px}
/* admin */
.adm-layout{display:flex;min-height:640px}
.adm-side{width:190px;background:var(--dark);color:#fff;padding:18px 12px;flex-shrink:0}
.adm-side .logo{font-weight:900;font-size:17px;padding:0 8px 14px;border-bottom:1px solid rgba(255,255,255,.14);margin-bottom:12px}
.adm-side button{display:flex;gap:9px;width:100%;background:none;border:0;color:#C9D6CC;text-align:right;padding:11px 10px;border-radius:10px;font-weight:700;font-size:14.5px;align-items:center}
.adm-side button.on{background:var(--green);color:#fff}
.adm-main{flex:1;padding:20px;background:#FAFBFA;overflow:auto}
.adm-main h2{margin:0 0 2px;font-size:21px;font-weight:900}
.adm-main .sub{color:var(--muted);font-size:13.5px;margin-bottom:16px}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media(max-width:700px){.kpi-row{grid-template-columns:1fr 1fr}.adm-side{display:none}}
.adm-kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.adm-kpi b{font-size:24px;font-weight:900;display:block}
.adm-kpi span{font-size:13px;color:var(--muted)}
.adm-kpi .up{color:var(--green);font-size:12.5px;font-weight:800}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:14px}
th{background:#F1F5F1;text-align:right;padding:11px 12px;font-weight:800;color:var(--green-d);white-space:nowrap}
td{padding:11px 12px;border-top:1px solid var(--line);vertical-align:top}
tr.hl td{background:#FFFBEB}
.split{background:var(--green-bg);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:6px}
.split b{color:var(--green-d)}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.panel h3{margin:0 0 12px;font-size:16px;font-weight:900}
.bars{display:flex;align-items:flex-end;gap:10px;height:130px;padding-top:8px}
.bar{flex:1;background:var(--green);border-radius:8px 8px 0 0;position:relative;min-height:8px}
.bar span{position:absolute;top:-24px;right:50%;transform:translateX(50%);font-size:12px;font-weight:800;white-space:nowrap}
.bar-l{display:flex;gap:10px}.bar-l span{flex:1;text-align:center;font-size:12px;color:var(--muted)}
/* sections below */
.section{padding:44px 0 8px}
.section h2{font-size:clamp(22px,3vw,30px);font-weight:900;margin:0 0 6px}
.section .lead{color:var(--muted);max-width:760px;margin:0 0 20px}
.tokens{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.token{border-radius:14px;padding:16px;color:#fff;font-weight:800;min-height:96px;display:flex;flex-direction:column;justify-content:flex-end;font-size:15px}
.token small{font-weight:500;opacity:.85;font-family:monospace;direction:ltr;text-align:left}
.token.light{color:var(--ink);border:1px solid var(--line)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.card h3{margin:0 0 8px;font-size:17px;font-weight:900}
.card p,.card li{font-size:14.5px;color:#33413A}
.card ul{margin:0;padding:0 18px 0 0}
.flow{display:flex;flex-wrap:wrap;gap:0;align-items:stretch}
.flow .step{flex:1;min-width:130px;background:#fff;border:1px solid var(--line);padding:14px;text-align:center;font-weight:800;font-size:14px;position:relative}
.flow .step small{display:block;color:var(--muted);font-weight:500;font-size:12.5px}
.flow .arr{display:grid;place-items:center;color:var(--green);font-size:20px;font-weight:900;padding:0 2px}
.dl-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px}
.dl{border:0;border-radius:12px;padding:13px 22px;font-weight:900;font-size:15px;background:var(--green-d);color:#fff}
.dl.alt{background:#fff;color:var(--green-d);border:1.5px solid var(--green)}
footer{padding:34px 0 44px;color:var(--muted);font-size:13.5px;text-align:center}
.toast{position:fixed;bottom:22px;right:50%;transform:translateX(50%) translateY(80px);background:var(--dark);color:#fff;border-radius:12px;padding:12px 22px;font-weight:800;z-index:99;transition:.35s;box-shadow:var(--shadow);font-size:15px;max-width:92vw;text-align:center}
.toast.show{transform:translateX(50%) translateY(0)}
.empty{text-align:center;padding:36px 10px;color:var(--muted)}
.empty .e{font-size:44px;display:block;margin-bottom:8px}
.addr{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;display:flex;gap:10px;align-items:center;margin-bottom:12px}
.addr b{display:block;font-size:15px}.addr span{font-size:13px;color:var(--muted)}
.note-sm{font-size:12.5px;color:var(--muted);margin-top:8px}
.seg{display:flex;background:#E7EDE8;border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;border-radius:9px;font-weight:800;font-size:14px;padding:8px;min-height:40px}

   {id:"c-prod",n:"صفحة منتج",who:"تفاصيل + وزن + بدائل",points:["اختيار كمية بالوحدات لمنتجات الوزن مع تنبيه سماحية ±10% في السعر النهائي.","سياسة الاستبدال بتتحدد هنا أو من السلة.","منتجات مشابهة لرفع قيمة السلة."],rule:"منتجات الوزن: الفرق البسيط في الوزن الفعلي بيتحاسب تلقائياً وبيبان للعميل قبل ما يدفع."},
   {id:"c-cart",n:"السلة",who:"مراجعة قبل الدفع",points:["هيدر السلة بيقول الطلب من أنهي محل بالاسم — السلة مرتبطة بمحل واحد بس، ولو حاولت تضيف منتج من محل تاني وانت عندك حاجات في السلة، بيطلع تنبيه: «سلتك فيها منتجات من محل تاني — تبدأ سلة جديدة؟» بزرارين (ابدأ سلة جديدة / خليك في سلتك).","سطر التوصيل بيبقى «توصيل (اسم المحل): X ج» — الرسم بتاع المحل اللي العميل اختاره حالياً، لأن كل محل بيحدد رسم توصيله بنفسه.","مفيش حد أدنى للطلب خالص: العميل يقدر يطلب صنف واحد بأي سعر، حتى لو أقل من 75 ج — وزر إتمام الطلب شغال دايماً. ومفيش توصيل مجاني في فترة الإطلاق: رسم توصيل المحل باين في كارت المحل قبل الطلب وبيتطبق على كل طلب توصيل.","اختيار سياسة الاستبدال عند نفاد صنف أثناء التحضير."],rule:"قراران محسومان (25 نوفمبر): مفيش حد أدنى للطلب أبداً — الطلب الصغير بيكمل عادي، واقتصادياً بيتغطى برسم التوصيل اللي بيحدده المحل. ومفيش توصيل مجاني في أول 90 يوم: دي فترة عمولة التاجر فيها صفر، فأي توصيل على حسابنا هيبقى خسارة صافية 15–20 ج على كل طلب مؤهّل — العميل بيدفع رسم توصيل المحل دايماً في الفترة دي. التوصيل المجاني فوق حد معيّن ممكن يرجع بعد ما العمولة تبدأ، وحدّه يتحدد وقتها من بيانات السلال الحقيقية (175 ج كانت رقماً مقترحاً مش قراراً). النموذج المالي المقترح بعد فترة الإطلاق: عمولة 8% من التاجر (مش من العميل) + رسم خدمة من المنصة لو اتفعّل، بيظهر سطراً منفصلاً عن رسم توصيل المحل."},
   {id:"c-pay",n:"الدفع",who:"إتمام الطلب",points:["رسم التوصيل المستخدم في الحساب هو رسم المحل المختار حالياً — كل محل بيحدد رسمه بنفسه (في الديمو: النور 30 ج، الخير 20 ج، البركة 25 ج، الورد 35 ج) — وسطر الإيصال بيبقى «توصيل (اسم المحل): X ج». مفيش رسم موحد لكل المحلات.","الباقي بعد المحفظة بيتدفع بكارت أونلاين عبر بوابة دفع — بيانات الكارت مش بتتخزن عندنا أبداً.","الكاش متاح للباقي: عند الاستلام من الباب في التوصيل، أو عند الاستلام من المحل في الـPickup.","عنوان التوصيل داخل منطقة الإطلاق (سموحة + سيدي جابر + سبورتنج) — وزر «تغيير» جنبه بيفتح شاشة «عناويني».","كود خصم شغال تجريبياً: WELCOME10 بيخصم 10% من إجمالي المنتجات وبيضيف سطر «خصم الكود» في الإيصال وبيحدّث الإجمالي وزر التأكيد — والكود الغلط بيطلع رسالة خطأ تحت الحقل.","دفع مقسّم: المحفظة اختيار تطبيق (Toggle) «استخدم رصيد محفظتي (50 ج)» وبتتطبق الأول دايماً على المستحق — بعد خصم الكود وحسب طريقة الاستلام — بمقدار min(الرصيد، المستحق). بعدها بيظهر قسم «الباقي» بقيمته المحسوبة فعلياً والعميل يختار يدفعه كارت أونلاين أو كاش (عند الاستلام من الباب في التوصيل / عند الاستلام من المحل في الـPickup). ولو الرصيد غطى المستحق بالكامل، قسم الباقي بيختفي وبيظهر «المحفظة غطّت طلبك بالكامل». الإيصال فيه سطر «من المحفظة: −50 ج» وسطر أخير «الباقي (كارت/كاش)»، وزر التأكيد بيحدّث نصه ومبلغه حسب التوزيعة النهائية.","حقل نصي اختياري «تعليمات التوصيل (اختياري)» بيظهر مع اختيار التوصيل — بمثال مكتوب جواه «ارن الجرس ومتخبطش» — والعميل يقدر يسيبه فاضي. اللي بيكتبه بيظهر بعد كده للمندوب مظلل وواضح في صفحة التوصيل عند التاجر.","اختيار طريقة الاستلام ببطاقتين واضحتين: «توصيل لباب البيت» (الافتراضي) و«استلام من المحل» — الاختيار شغال وبيأثر على كل اللي بعده.","لو اختار الاستلام: سطر الرسم بيبقى «استلام من المحل — بدون رسم» والإجمالي بينقص بقيمة رسم توصيل المحل المختار حالياً وزر التأكيد بيبقى «أكد الطلب — استلام من المحل»، وبيظهر تحت الاختيار عنوان المحل المختار وساعات عمله. كود WELCOME10 والمحفظة شغالين في الحالتين."],rule:"الدفع الأونلاين = مفيش أي كود استلام. العميل بيدفع وخلاص — الاحتكاك صفر."},
   {id:"c-track",n:"تتبع الطلب",who:"حالة حية",points:["طلبات التوصيل: اسم المحل اللي طلبت منه وكابتن المحل ده باينين في شاشة التتبع من أول لحظة.","طلبات الاستلام من المحل: مفيش تتبع كابتن — بتظهر حالة التجهيز وبعدين «جاهز للاستلام من [اسم المحل]» مع رقم الطلب كبير وواضح (العميل بيوريه للمحل وهو بيستلم) وعنوان المحل وساعات العمل. رقم الطلب نفسه هو إثبات الاستلام — مفيش كود استلام إضافي.","خط زمني واضح: اتقبل ← بيتحضر ← في الطريق ← اتسلم.","وقت الوصول المتوقع ظاهر وكبير وبيتحدث لحظة بلحظة — والمحل قريب أصلاً (نطاق توصيل صغير ~1 كم حوالين كل محل) فالرحلة قصيرة بطبيعتها.","العميل شاهد صامت: إشعار عند الخروج والتسليم.","تحت التتبع بيظهر تقييم آخر طلب اتسلم من نفس المحل («قيّم المحل» بنجوم 1–5 وتعليق اختياري) — نفس تقييم شاشة «طلباتي» وبيأثر في رقم المحل على كرته."],rule:"الإغلاق التلقائي: GPS + 30–45 دقيقة من غير شكوى = الطلب اتسلم — التسوية مش رهينة ضغطة مندوب."},
   {id:"c-orders",n:"طلباتي / حسابي",who:"سجل وإعادة طلب",points:["إعادة طلب سابقة بضغطة واحدة — أهم محرك تكرار في البقالة.","حالة كل طلب بنفس شارات الألوان الموحدة.","بعد ما الطلب يوصل، بيظهر «قيّم المحل» تحت الطلب المتسلم: نجوم 1–5 وتعليق اختياري — وبعد الإرسال بيظهر شكر، والتقييم بيحدّث الرقم المعروض على كارت المحل فوراً (متوسط التقييمات + تقييمك). نفس التقييم بيظهر في شاشة تتبع الطلب كمان.","المرتجعات: المقفول خلال 14 يوم، والطازج بعيب جودة بيتصور ويتحسم في نفس اليوم.","تحت الطلبات قسم «حسابي»: كارت «محفظتي» برصيد الاستردادات والمستحقات، وصفوف تنقّل لـ«محفظتي» و«عناويني» و«المساعدة والدعم»."],rule:"قاعدة المرتجعات: عيب الجودة في الطازج = استرداد/استبدال فوري من غير ما المنتج يرجع أصلاً. وقاعدة التقييم: تقييم واحد لكل طلب متسلم — هو اللي بيحرّك رقم المحل قدام كل العملاء وبيقدّمه عند تساوي القرب."},
   {id:"c-addresses",n:"عناويني",who:"عناوين محفوظة + إضافة عنوان",points:["قائمة بالعناوين المحفوظة (البيت — سموحة «افتراضي» / الشغل — سيدي جابر) وأي عنوان يقدر يبقى الافتراضي بضغطة واحدة.","زر «+ إضافة عنوان جديد» بيفتح نموذج: الاسم (بيت/شغل/أخرى) + العنوان بالتفصيل + رقم الموبايل + زر «تحديد الموقع على الخريطة» بمعاينة خريطة، وزر الحفظ بيضيف العنوان للقائمة فوراً.","الدخول من 3 أماكن: عنوان التوصيل في هيدر الرئيسية (قابل للضغط)، وزر «تغيير» في صف العنوان بشاشة الدفع، وصف «عناويني» في قائمة حسابي."],rule:"العنوان الافتراضي هو عنوان التوصيل التلقائي لأي طلب جديد — والتبديل أو الإضافة بيتموا في أي وقت ومن أي مكان، قبل تأكيد الطلب."},
   {id:"c-help",n:"المساعدة والدعم",who:"تواصل + أسئلة شائعة + تذاكر",points:["أزرار تواصل مباشرة: واتساب، اتصال هاتفي، بريد إلكتروني.","قسم أسئلة شائعة مختصرة — 3 أسئلة قابلة للفتح (التتبع، مشاكل الجودة والاسترداد، الرسوم والدفع).","صفوف صفحات التواصل (فيسبوك / انستجرام / تيك توك) وزر «افتح تذكرة دعم» لأي مشكلة محتاجة متابعة."],rule:"الدعم بشري ومتاح من جوه التطبيق — والاستردادات بتنزل في محفظة العميل يقدر يدفع بيها في طلباته الجاية."}
  ]},
 merchant:{label:"تطبيق التاجر",sub:"موبايل · تشغيل المحل",icon:"ت",type:"phone",
  screens:[
   {id:"m-home",n:"لوحة اليوم",who:"نبض المحل",points:["أرقام اليوم في نظرة واحدة: طلبات، مبيعات أونلاين، ومتوسط زمن التحضير.","تنبيه فوري لو فيه طلب جديد مستني قبول.","سكور التنفيذ ظاهر — هو اللي بيحدد نصيب المحل من الطلبات الجاية."],rule:"جودة التنفيذ (قبول سريع + تحضير مظبوط + أخطاء قليلة) هي اللي بتبني تقييم محلك قدام العملاء وبتجيبله طلبات أكتر."},
   {id:"m-orders",n:"طلبات جديدة",who:"قبول بمؤقّت SLA",points:["كل طلب جديد بمؤقّت قبول ملوّن: أخضر ← أصفر ← أحمر.","زر قبول ضخم — الشغل بيتم بسرعة وبإيد واحدة، والقبول بيبدأ مؤقّت التحضير على طول.","الطلبات دي من عملاء اختاروا محلك بنفسهم من قائمة المحلات — وكل طلب يوصلك المفروض يبقى متوفر عندك حسب مخزونك وحصة الأونلاين اللي إنت محددها.","طلبات الاستلام من المحل عليها شارة «استلام من المحل» باينة في قائمة الطلبات، ولما الطلب يجهز زر الإجراء بيبقى «جاهز للاستلام» وبيبعت إشعار للعميل بنفس أسلوب الأزرار الحالية — ومفيش زر رفض أصلاً زي ما هو متفق."],rule:"اتفاق مستوى الخدمة: القبول في دقيقة واحدة والتحضير في 4 دقايق بالكتير — والتأخير المتكرر بيقلل نصيب الطلبات."},
   {id:"m-detail",n:"تفاصيل طلب / تجهيز",who:"تحضير بكاميرا الباركود — مسحة لكل وحدة",points:["التحضير بالباركود بس: كل منتج مطلوب بيظهر بالكمية المطلوبة وعدد اللي اتحضّر، وزرار «مسح بالكاميرا» عند أي بند بيفتح شاشة كاميرا كاملة جوه الموبايل — مفيش تأكيد يدوي بضغطة على المنتج نفسه، عشان المحضّر ميعلّمش على منتج ملقهوش ويحط بديل من عنده.","شاشة الكاميرا شبه الماسح الحقيقي: خلفية غامقة، إطار توجيه بزوايا في النص، خط مسح أحمر بيتحرك رايح جاي، ونص «وجّه الكاميرا ناحية باركود (اسم المنتج)» مع اسم المنتج وعدد المحضّر/المطلوب، وزرار إلغاء وأيقونة فلاش بتشتغل فعلاً (بتفتح إضاءة الشاشة).","مسحة لكل وحدة: طلب 10 يعني 10 فتحات كاميرا و10 مسحات. في الديمو المسح بينجح تلقائياً بعد حوالي ثانية وربع: صوت بيب + وميض أخضر وعلامة ✓ ورسالة تعريف بالمنتج ورقم باركوده، وبعدها الكاميرا تقفل والعدّاد يزيد واحد — وإلغاء الكاميرا مبيغيّرش أي عدد.","جوه الكاميرا خيار «إدخال الباركود يدوياً»: كتابة الرقم الصح (EAN-13 لكل منتج في الديمو، والتلميح ظاهر جوه الحقل للتجربة) بتأكد المسحة، ورقم غلط بيطلع خطأ «الباركود ده مش بتاع المنتج المطلوب» من غير ما العدّاد يتحرك. ورابط «الباركود مش بيقرأ؟» بيرجع لمسار البديل اليدوي بالأسباب اللي تحت المنتج.","تحت كل منتج رابط صغير «المنتج من غير باركود؟» بيفتح اختيار سبب (من غير باركود / باركود تالف) وبيتسجل كتأكيد يدوي استثنائي بالسبب — للمنتجات اللي فعلاً ملهاش باركود مقروء بس.","الطلب مبيبقاش «جاهز» غير لما كل البنود تكتمل — ولو المحضّر أعلن نقص في بند، بيظهر تنبيه واضح إن النقص بيأثر في تقييم وأداء المحل (بيتخصم من سكور التنفيذ وبيقلل ظهور المحل)."],rule:"قاعدة التحضير: الباركود هو إثبات إن المنتج الصح اتجاب بالعدد الصح — النقص المعلن حادثة دقة بتتسجل على المحل، والتأكيد اليدوي استثناء بسبب مسجل مش الطريقة العادية. طلب التوصيل بعد الجاهزية بيتنقل لصفحة التوصيل — وطلب الاستلام العميل بييجي ياخده بنفسه برقم الطلب، وزرّك بيبقى «جاهز للاستلام» وبيبعتله إشعار."},
   {id:"m-delivery",n:"صفحة التوصيل",who:"تفاصيل كاملة للمندوب بعد «جاهز للتسليم»",points:["بعد ما الطلب يبقى «جاهز للتسليم»، طلب التوصيل بيتنقل لصفحة توصيل مستقلة — مش بوكس صغير وخلاص — فيها كل اللي المندوب محتاجه في مشوار واحد.","عنوان العميل كامل ومفصّل: المنطقة، الشارع، العمارة، الدور، الشقة، والعلامة المميزة — سطر سطر عشان المندوب يوصل من غير ما يدوّر.","رقم العميل باين مع زرار اتصال مباشر، وزر فتح العنوان على الخريطة.","تعليمات التوصيل اللي العميل كتبها في شاشة الدفع بتظهر هنا في خانة مظللة وواضحة بخط كبير — المندوب لازم يقراها قبل ما يتحرك (مثلاً: «ارن الجرس ومتخبطش»).","ملخص الطلب والدفع: عدد الأصناف والإجمالي وطريقة الدفع (مدفوع أونلاين / كاش عند الاستلام) — وزرار «تم التسليم» بيقفل المشوار."],rule:"طلبات الاستلام من المحل مش بتدخل صفحة التوصيل أصلاً — بتفضل بعرض الاستلام الحالي: الشنطة جاهزة عند الكاشير والعميل بيستلم برقم الطلب. صفحة التوصيل لطلبات التوصيل بس."},
   {id:"m-inv",n:"مخزوني",who:"كميات + حصة الأونلاين",points:["تعديل كمية أي صنف بخطوتين — التحديث السريع هو شرط ظهور المنتج للعملاء.","سلايدر «حصة الأونلاين»: جزء من المخزون محجوز لمبيعات المحل نفسه.","تنبيه أصناف قربت تخلص قبل ما تختفي من التطبيق."],rule:"المخزون مصدر الحقيقة: أي بيع (محل أو أونلاين) بيخصم من نفس العدد — وتكامل POSMate مستقبلاً بيخلي ده تلقائي."},
   {id:"m-settle",n:"رصيدي والتحويلات",who:"فلوسي توصلي في 24 ساعة",points:["رصيدان منفصلان وواضحان: «متاح» تقدر تطلبه دلوقتي، و«معلّق» (طلبات النهاردة) بيستوي ويبقى متاح تاني يوم T+1 بعد تأكيد التسليم وعدّي نافذة المشاكل.","صف «رسم التوصيل» في إعدادات المحل تحت الرصيد: بيعرض رسم توصيل محلك الحالي (النور: 30 ج في الديمو) وتقدر تعدّله بأزرار +/− — التعديل بيظهر فوراً للعملاء في كارت المحل وبيتطبق على الطلبات الجديدة، مع ملحوظة إن المنصة حاطة حد أقصى للرسم (50 ج). كل محل بيحدد رسمه بنفسه فالرسوم بتختلف من محل لمحل، والرسم بيوصلك كامل مع كل طلب توصيل.","زرار «اطلب تحويل» بيبعت InstaPay فوري على مدار الساعة — حتى الجمعة والسبت — والفلوس توصل في دقايق، مش آخر الأسبوع.","طلبات الكاش (COD) مش بتتحوّل أصلاً: فلوسها عند التاجر من لحظة التسليم، فبتتعمل مقاصّة — العمولة المستحقة عليها بتتخصم من مستحقات الدفع الأونلاين، وكتير من التجار صافي تحويلهم بيقل أو يبقى صفر."],rule:"قاعدة الـ24 ساعة: الرصيد يستوي T+1 والتحويل InstaPay فوري (رسم 0.1% بحد أقصى 20 ج). شرط التنفيذ الحاسم: بوابة الدفع لازم تسوّي للمنصة نفسها T+1 — لو البوابة أسبوعية (جدول Paymob القياسي) المنصة هتضطر تسلّف التاجر من رأس مالها، وعشان كده سرعة تسوية البوابة عامل حسم في الاختيار (Kashier بتعلن تسوية مرنة/فورية بالاتفاق). ولسه سارية مصفوفة الأخطاء: خطأ المحل على المحل، وخطأ المنصة علينا."}

var RENDER={"c-home":sHome,"c-store":sStore,"c-cat":sCat,"c-prod":sProd,"c-cart":sCart,"c-pay":sPay,"c-track":sTrack,"c-orders":sOrders,"c-addresses":sAddresses,"c-help":sHelp,"m-home":sMHome,"m-orders":sMOrders,"m-detail":sMDetail,"m-delivery":sMDelivery,"m-inv":sMInv,"m-settle":sMSettle,"a-dash":sADash,"a-orders":sAOrders,"a-stores":sAStores,"a-catalog":sACatalog};
function render(){
 var app=APPS[state.app];
 document.getElementById("appTabs").innerHTML=Object.keys(APPS).map(function(k){var a=APPS[k];return '<button class="app-tab '+(state.app===k?"active":"")+'" onclick="setApp(\''+k+'\')"><span class="ic">'+a.icon+'</span><span><b>'+a.label+'</b><small>'+a.sub+' · '+a.screens.length+' شاشات</small></span></button>'}).join("");
 document.getElementById("scrList").innerHTML=app.screens.map(function(s,i){return '<button class="scr-btn '+(state.screen===s.id?"active":"")+'" onclick="go(\''+s.id+'\')"><span style="display:flex;gap:9px;align-items:center"><span class="n">'+(i+1)+'</span>'+s.n+'</span></button>'}).join("");
 var html=RENDER[state.screen]();
 if(state.app==="customer")html+=conflictModal();
 if(state.app==="merchant")html+=camOverlay();
 var wrap=document.getElementById("deviceWrap");
 if(app.type==="phone"){
   wrap.innerHTML='<div class="phone"><div class="phone-scr '+(state.app==="merchant"?"merchant":"")+'">'+html+'</div></div>';
 }else{
   wrap.innerHTML='<div class="desktop">'+html+'</div><p class="flow-hint">لوحة ويب (React) — اتنقل بين المؤشرات والطلبات الحية والمحلات والكتالوج من القائمة الجانبية — وكل طلب بيبان جنبه المحل اللي العميل اختاره.</p>';
 }
 window.scrollTo({top:document.querySelector(".switcher").offsetTop-8,behavior:"smooth"});
}
function setApp(k){clearCamTimers();state.cam=null;state.app=k;state.screen=APPS[k].screens[0].id;if(k==="admin")state.adminScr=state.screen;render()}
function go(id){clearCamTimers();state.cam=null;state.screen=id;if(id[0]==="a")state.adminScr=id;if(id[0]==="c")state.app="customer";if(id[0]==="m")state.app="merchant";if(id[0]==="a")state.app="admin";render()}
function setQty(id,q,storeId){
 if(storeId&&cartCount()>0&&state.cartStore!==storeId&&q>(state.cart[id]||0)){state.conflict={id:id,storeId:storeId,qty:q};render();return}
 if(q<=0)delete state.cart[id];else{if(cartCount()===0&&storeId)state.cartStore=storeId;state.cart[id]=q}
 render();if(q>0&&state.screen==="c-store")toast("اتضاف للسلة 🛒 الإجمالي "+money(cartTotal()))}
function openStore(id){state.store=id;state.storeCat="الكل";state.screen="c-store";render()}
function setStoreCat(c){state.storeCat=c;render()}
function conflictModal(){
 if(!state.conflict)return "";
 var cur=storeById(state.cartStore),nw=storeById(state.conflict.storeId);
 return '<div style="position:absolute;inset:0;background:rgba(20,32,26,.55);z-index:40;display:flex;align-items:flex-end">'+
 '<div style="background:#FFFDF6;width:100%;border-top:2.5px solid var(--ink2);border-radius:20px 20px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom))">'+
 '<div style="font-size:34px;text-align:center">🛒</div>'+
 '<h3 style="margin:4px 0 8px;font-size:19px;font-weight:900;text-align:center">سلتك فيها منتجات من محل تاني — تبدأ سلة جديدة؟</h3>'+
 '<p style="margin:0 0 16px;font-size:14.5px;color:var(--muted);text-align:center">سلتك الحالية من «'+cur.name+'» والمنتج ده من «'+nw.name+'». السلة الواحدة من محل واحد بس — لو بدأت سلة جديدة، سلتك الحالية هتتفضى.</p>'+
 '<button class="btn-main" style="justify-content:center;margin-bottom:10px" onclick="confirmNewCart()"><span>ابدأ سلة جديدة من '+nw.name+'</span></button>'+
 '<button class="btn-ghost" onclick="keepCart()">خليك في سلتك من '+cur.name+'</button></div></div>';
}
function confirmNewCart(){var c=state.conflict;state.cart={};state.cartStore=c.storeId;state.cart[c.id]=c.qty;state.conflict=null;render();toast("بدأت سلة جديدة من "+storeById(c.storeId).name+" 🛒")}
function keepCart(){var n=storeById(state.cartStore).name;state.conflict=null;render();toast("تمام — سلتك زي ما هي من "+n)}
function setCat(c){state.cat=c;render()}
function setFulfillment(f){state.fulfillment=f;render();if(f==="pickup")toast("استلام من المحل 🏪 اتشال رسم التوصيل — وفّرت "+money(storeById(state.cartStore).fee))}
function setPay(p){state.pay=p;render()}
function toggleWallet(){state.useWallet=!state.useWallet;render();toast(state.useWallet?"اتفعّلت المحفظة 👛 هتتخصم من المستحق الأول":"اتلغى استخدام المحفظة — المستحق كله بطريقة واحدة")}
function setSub(s){state.sub=s;render()}
function orderDone(){state.screen="c-track";render();toast(state.fulfillment==="pickup"?"تم استلام طلبك ✅ المحل بيحضّره — هنبعتلك إشعار أول ما يجهز للاستلام من المحل":"تم استلام طلبك ✅ جاري التحضير — تابع حالته لحظة بلحظة")}
function reorder(){state.cart={2:1,7:2,10:1};state.screen="c-cart";render();toast("اتحطت أصناف الطلب في السلة")}
function acceptOrder(m){clearCamTimers();state.cam=null;state.mMethod=m||"delivery";state.screen="m-detail";state.picked={};state.prep={};state.manualOpen=null;state.scanFx=null;render();toast("اتقبل الطلب — مؤقّت التحضير بدأ ⏱ امسح باركود كل وحدة بالكاميرا وانت بتحضّر")}
function requestPayout(){state.payoutDone=true;render();toast("اتحوّل رصيدك InstaPay ⚡ 3,810 ج وصلت لحساب المحل")}
function invDelta(id,d){state.inv[id]=Math.max(0,state.inv[id]+d);render()}
function feeDelta(d){var st=storeById(1);var nf=st.fee+d;if(nf>50){toast("وصلت للحد الأقصى اللي المنصة حاطاه لرسم التوصيل (50 ج) 🚴");return}if(nf<0){toast("رسم التوصيل مش ممكن يبقى أقل من صفر");return}st.fee=nf;render();toast("اتحدّث رسم توصيل محلك: "+money(st.fee)+" — هيظهر للعملاء في كارت محلك فوراً")}
function setShare(v){state.share=+v;render()}
/* SLA timer tick */
setInterval(function(){if(state.screen==="m-orders"&&state.timer>0){state.timer-=1;var el=document.getElementById("slaTimer");if(el){el.textContent="⏱ "+fmtTimer(state.timer);el.className="timer "+(state.timer>300?"":(state.timer>120?"mid":"late"))}}},1000);
/* ================= DOWNLOADS ================= */
function dl(name,content,type){var b=new Blob([content],{type:type});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},2000)}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function frameSVG(x,y,w,h,title,sub,accent,blocks){
 var s='<g transform="translate('+x+','+y+')">';
 s+='<rect x="0" y="0" width="'+w+'" height="'+h+'" rx="24" fill="#FFFFFF" stroke="#E3EAE4" stroke-width="2"/>';
 s+='<rect x="0" y="0" width="'+w+'" height="64" rx="24" fill="'+accent+'"/>';
 s+='<text x="'+(w-20)+'" y="30" font-family="Tajawal, Arial" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="end">'+esc(title)+'</text>';
 s+='<text x="'+(w-20)+'" y="52" font-family="Tajawal, Arial" font-size="12" fill="#FFFFFF" opacity="0.85" text-anchor="end">'+esc(sub)+'</text>';
 var cy=84;
 blocks.forEach(function(b){
   if(b==="grid"){s+='<rect x="16" y="'+cy+'" width="'+((w-44)/2)+'" height="110" rx="14" fill="#F0FDF4" stroke="#DCFCE7"/><rect x="'+(28+(w-44)/2)+'" y="'+cy+'" width="'+((w-44)/2)+'" height="110" rx="14" fill="#F0FDF4" stroke="#DCFCE7"/>';cy+=126;}
   else if(b==="bar"){s+='<rect x="16" y="'+cy+'" width="'+(w-32)+'" height="14" rx="7" fill="#DCFCE7"/><rect x="16" y="'+cy+'" width="'+Math.round((w-32)*0.6)+'" height="14" rx="7" fill="#16A34A"/>';cy+=28;}
   else if(b==="btn"){s+='<rect x="16" y="'+(h-70)+'" width="'+(w-32)+'" height="48" rx="14" fill="#16A34A"/><text x="'+(w/2)+'" y="'+(h-40)+'" font-family="Tajawal, Arial" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">الإجراء الرئيسي</text>';}
   else if(b==="table"){for(var r=0;r<4;r++){s+='<rect x="16" y="'+(cy+r*44)+'" width="'+(w-32)+'" height="36" rx="8" fill="'+(r===0?"#F1F5F1":"#FFFFFF")+'" stroke="#E3EAE4"/>';}cy+=190;}
   else{s+='<rect x="16" y="'+cy+'" width="'+(w-32)+'" height="52" rx="12" fill="#F7F8F7" stroke="#E3EAE4"/><circle cx="'+(w-44)+'" cy="'+(cy+26)+'" r="13" fill="#DCFCE7"/>';cy+=64;}
 });
 return s+"</g>";
}
function downloadSVG(){
 var parts=['<svg xmlns="http://www.w3.org/2000/svg" width="2900" height="2600" viewBox="0 0 2900 2600" font-family="Tajawal, Arial">','<rect width="2900" height="2600" fill="#F7F8F7"/>'];
 parts.push('<text x="2880" y="52" font-size="30" font-weight="bold" fill="#14532D" text-anchor="end">تصوّر UI/UX — التطبيقات الثلاثة · سوق سموحة · v1</text>');
 var layout={customer:{accent:"#16A34A",blocks:["row","bar","grid","grid","btn"]},merchant:{accent:"#14532D",blocks:["row","row","bar","grid","btn"]},admin:{accent:"#14201A",blocks:["table","row","bar","table"]}};
 var y=90;
 Object.keys(APPS).forEach(function(k){
   var a=APPS[k],L=layout[k],w=k==="admin"?640:380,h=k==="admin"?430:560;
   parts.push('<text x="2880" y="'+(y+26)+'" font-size="24" font-weight="bold" fill="#14201A" text-anchor="end">'+esc(a.label)+'</text>');y+=44;
   var x=2880-w;
   a.screens.forEach(function(scr){
     if(x<0){x=2880-w;y+=h+40;}
     parts.push(frameSVG(x,y,w,h,scr.n,scr.who,L.accent,L.blocks));
     x-=w+36;
   });
   y+=h+70;
 });
 parts.push("</svg>");
 dl("smouha-3apps-screens.figma.svg",parts.join("\n"),"image/svg+xml");
 toast("اتحمّل ملف SVG بكل الشاشات ("+Object.keys(APPS).reduce(function(a,k){return a+APPS[k].screens.length},0)+") — اسحبه داخل Figma وهيتحول لـ Frames وطبقات");
}
function downloadTokens(){
 var tokens={color:{primary:"#16A34A",primaryDark:"#14532D",offer:"#F59E0B",danger:"#DC2626",bg:"#F7F8F7",card:"#FFFFFF",ink:"#14201A",muted:"#5B6B60"},font:{family:"Tajawal",weights:[400,500,700,800,900]},radius:{card:16,button:14,chip:999},status:{new:"#DBEAFE",preparing:"#FEF3C7",onTheWay:"#E0E7FF",delivered:"#DCFCE7",late:"#FEE2E2"},minOrderEGP:null};
 dl("design-tokens.json",JSON.stringify(tokens,null,2),"application/json");toast("اتحمّل ملف Design Tokens — استورده في Figma كمتغيرات");
}
function downloadSpec(){
 var md="# مواصفات شاشات التطبيقات الثلاثة — v1 (25 نوفمبر 2026)\n\n";
 Object.keys(APPS).forEach(function(k){var a=APPS[k];md+="## "+a.label+" ("+a.screens.length+" شاشات)\n\n";a.screens.forEach(function(s,i){md+="### "+(i+1)+". "+s.n+" — "+s.who+"\n";s.points.forEach(function(p){md+="- "+p+"\n"});md+="- قاعدة العمل: "+s.rule+"\n\n"})});
 md+="## نظام التصميم\n- الأساسي #16A34A · داكن #14532D · عروض #F59E0B · خطر #DC2626 · خلفية #F7F8F7\n- الخط: Tajawal (400/500/700/800/900) · عربي RTL بالكامل · لهجة مصرية في النصوص\n";
 dl("screens-spec.md",md,"text/markdown");toast("اتحمّلت مواصفات الشاشات — ارفعها مع الـ Tokens لفريق Figma");
}
render();
</script>
